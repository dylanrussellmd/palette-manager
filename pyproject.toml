[project]
name = "palette-manager"
version = "0.1.0"
description = "TUI for managing color palettes for niri + Quickshell theming"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Dylan Russell" }]
dependencies = [
    "textual>=0.50.0",
    "ruamel.yaml>=0.18.0",
]

[project.scripts]
palette-manager = "palette_manager:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/palette_manager"]
